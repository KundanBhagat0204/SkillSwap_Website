<div
    class="min-h-screen flex items-center justify-center bg-gradient-to-tr from-pink-200 via-blue-300 to-purple-400 dark:from-slate-900 dark:via-slate-800 dark:to-indigo-900 px-4">
    <div
        class="relative w-full max-w-md bg-white/30 dark:bg-slate-900/40 backdrop-blur-2xl border border-white/40 dark:border-slate-200/10 shadow-2xl rounded-3xl sm:p-8 p-4 my-[5px] transition-all duration-300"
        style="box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.25);">
    <div
            class="absolute -top-10 left-1/2 -translate-x-1/2 w-24 h-24 bg-gradient-to-br from-pink-300/60 to-blue-400/40 rounded-full blur-2xl -z-10">
        </div>
        <h1 class="text-3xl font-bold text-center text-gray-900 dark:text-white mb-8 drop-shadow">Create your account
        </h1>
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <label for="name" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">Full Name</label>
            <input id="name" formControlName="name" type="text"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white/80 dark:bg-slate-700/80 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-200 dark:focus:ring-pink-400 outline-none transition mb-5 backdrop-blur" />

            <label for="email" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">Email</label>
            <input id="email" formControlName="email" type="email"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white/80 dark:bg-slate-700/80 text-gray-900 dark:text-white focus:ring-2 focus:ring-purple-300 dark:focus:ring-blue-600 outline-none transition mb-5 backdrop-blur" />

            <label for="password"
                class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">Password</label>
            <div class="relative">
                <input id="password" formControlName="password" [type]="showPassword ? 'text' : 'password'"
                    class="w-full px-4 py-3 pr-12 rounded-xl border border-gray-300 dark:border-gray-600 bg-white/80 dark:bg-slate-700/80 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-400 dark:focus:ring-purple-600 outline-none transition mb-4 backdrop-blur" />
                <button type="button" (click)="togglePasswordVisibility()"
                    class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors">
                    <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                    </svg>
                </button>
            </div>

            <label for="role" class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">I want to be
                a:</label>
            <select id="role" formControlName="role"
                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white/80 dark:bg-slate-700/80 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-300 dark:focus:ring-pink-500 outline-none transition mb-6 backdrop-blur">
                <option value="mentee">Mentee (I want to learn)</option>
                <option value="mentor">Mentor (I want to teach)</option>
            </select>

            <button [disabled]="submitting"
                class="w-full py-3 px-4 rounded-2xl font-medium shadow-lg text-white bg-gradient-to-r from-pink-600 to-blue-600 hover:opacity-90 hover:scale-[1.01] transition disabled:opacity-60 disabled:cursor-not-allowed">
                {{ submitting ? 'Creating account...' : 'Sign up' }}
            </button>

            <div class="mt-6 text-center text-sm text-gray-700 dark:text-gray-300">
                Already have an account?
                <a routerLink="/auth/login"
                    class="font-semibold text-blue-700 dark:text-pink-400 hover:underline transition">Log in</a>
            </div>
        </form>
    </div>
</div>
